<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="navigation">
  <div class="header-inner">
    <div class="header-left">
      <a class="brand" th:href="@{/services}">
        <span class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </span>
        <span class="brand-text-wrap">
          <span>应急数据共享平台</span>
          <span class="brand-badge">CONSOLE</span>
        </span>
      </a>
      <nav class="main-nav" aria-label="主要导航">
        <a th:href="@{/services}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>当前服务</span>
        </a>
        <a th:href="@{/config}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
          </svg>
          <span>平台配置</span>
        </a>
        <a th:href="@{/tasks}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span>任务记录</span>
        </a>
      </nav>
    </div>
    <div class="header-status" aria-label="引擎运行态势">
      <span class="engine-pill">
        <span class="status-dot" aria-hidden="true"></span>
        <span>FTP / SFTP ENGINE · ONLINE</span>
      </span>
    </div>
  </div>
</header>
</body>
</html>
