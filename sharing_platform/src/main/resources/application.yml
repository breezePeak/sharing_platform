spring:
  application:
    name: sharing-platform
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 5000
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
  mvc:
    log-request-details: false
  task:
    scheduling:
      pool:
        size: 2
server:
  tomcat:
    max-http-form-post-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
platform:
  console:
    username: ${CONSOLE_USERNAME:}
    password: ${CONSOLE_PASSWORD:}
    refresh-millis: 2000
  endpoints:
    master-key: ${ENDPOINT_MASTER_KEY:}
    key-directory: ${ENDPOINT_KEY_DIRECTORY:}
